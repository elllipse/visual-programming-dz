name: Test lab1type

on:
  push:
    branches: [ lab1 ]
  pull_request:
    branches: [ lab1 ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./lab1type  
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: lab1type/package-lock.json
    
    - name: Install dependencies
      run: npm ci  
      
    - name: Run tests
      run: npm test 
      
    - name: Run coverage
      run: npm run coverage --if-present