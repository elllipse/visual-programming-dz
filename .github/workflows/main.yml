name: Test lab1type

on:
  push:
    branches: [ lab1 ]
  pull_request:
    branches: [ lab1 ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./lab1type  
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'
    
    - name: Force reinstall all dependencies (fix for optional deps)
      run: |
        rm -rf node_modules package-lock.json
        npm cache clean --force
        npm install
        
    - name: Verify native bindings are present
      run: ls -la node_modules/@rolldown/ || echo "Check manually"
      
    - name: Run tests
      run: npm test 
      
    - name: Run coverage
      run: npm run coverage --if-present