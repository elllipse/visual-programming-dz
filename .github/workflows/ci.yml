name: CI/CD

on:
  push:
    branches: [ "*" ]      # ЗАПУСКАЕТСЯ НА ЛЮБОЙ ВЕТКЕ!
  pull_request:
    branches: [ "lab1" ]
  workflow_dispatch:        # можно запустить ручками

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8
          
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'pnpm'
          
      - name: Install dependencies
        run: pnpm install
        working-directory: ./lab1type
        
      - name: Run tests
        run: pnpm test
        working-directory: ./lab1type
        
      - name: Run coverage
        run: pnpm coverage
        working-directory: ./lab1type
