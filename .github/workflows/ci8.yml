name: CI

on:
  push:
    branches: [ "lab8-9", "main" ]
  pull_request:
    branches: [ "lab8-9" ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./lab8-9
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: lab8-9/pnpm-lock.yaml
          
      - name: Install dependencies
        run: pnpm install
        
      - name: Run tests
        run: pnpm run test
        
      - name: Run build
        run: pnpm run build