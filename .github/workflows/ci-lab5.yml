name: CI/CD Lab5

on:
  push:
    branches: [ "lab5" ]
  pull_request:
    branches: [ "lab5" ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./lab5
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8
          
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: lab5/pnpm-lock.yaml
          
      - name: Install dependencies
        run: pnpm install
        
      - name: Run tests
        run: pnpm test:run
        
      - name: Run coverage
        run: pnpm coverage